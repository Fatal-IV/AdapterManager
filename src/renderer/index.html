<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>NetworkAdapterManager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="toolbar-title">
        <button class="icon-btn" title="Menü" onclick="openDrawer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="toolbar-separator"></span>
        <span data-i18n="app.title">AdapterManager</span>
      </div>
      <div class="toolbar-actions">
        <button class="icon-btn" id="settingsBtn" title="Ayarlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <main>
      <div class="auto-card">
        <div class="auto-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        </div>
        <div class="auto-copy">
          <h3 data-i18n="auto.title">Otomatik Mod</h3>
          <p data-i18n="auto.subtitle">Ethernet bağlandığında Wi-Fi otomatik olarak kapanır</p>
        </div>
        <button class="switch" data-on="false"></button>
      </div>

      <div class="section-label" data-i18n="section.adapters">Adaptörler</div>
      <div class="adapter-list"></div>
    </main>

    <footer data-i18n="footer.adminNotice">Yönetici olarak çalışıyor</footer>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 data-i18n="drawer.title">Adaptörler</h2>
      <button class="icon-btn" onclick="closeDrawer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" data-i18n-placeholder="drawer.search" placeholder="Adaptör ara…">
    </div>
    <div class="segmented">
      <button class="active" data-filter="all" data-i18n="filter.all">Tümü</button>
      <button data-filter="active" data-i18n="filter.active">Aktif</button>
      <button data-filter="inactive" data-i18n="filter.inactive">Pasif</button>
    </div>
    <div class="drawer-list"></div>
  </div>

  <div class="scrim" id="drawerScrim"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <div class="adapter-glyph" id="sheetGlyph"></div>
      <div>
        <h2 id="sheetTitle">—</h2>
        <p id="sheetSub">—</p>
      </div>
      <button class="icon-btn sheet-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-panel="ip" data-i18n="tab.ip">IP / DNS</button>
      <button class="tab" data-panel="proxy" data-i18n="tab.proxy">Proxy</button>
      <button class="tab" data-panel="wifi" data-i18n="tab.wifi">Ağlar</button>
    </div>
    <div class="tabs-line"></div>

    <div class="sheet-body">
      <div class="panel active" data-panel="ip">
        <div class="segmented">
          <button class="active" data-mode="dhcp">Otomatik (DHCP)</button>
          <button data-mode="manual">Manuel</button>
        </div>
        <div class="field-group">
          <div class="field">
            <label>IP Adresi</label>
            <input value="">
          </div>
          <div class="field-row">
            <div class="field">
              <label>Alt Ağ Maskesi</label>
              <input value="">
            </div>
            <div class="field">
              <label>Ağ Geçidi</label>
              <input value="">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>DNS 1</label>
              <input value="">
            </div>
            <div class="field">
              <label>DNS 2</label>
              <input value="">
            </div>
          </div>
        </div>
      </div>

      <div class="panel" data-panel="proxy">
        <div class="segmented">
          <button data-mode="proxy-off">Kapalı</button>
          <button data-mode="proxy-auto">Otomatik Algıla</button>
          <button data-mode="proxy-manual">Manuel</button>
        </div>
        <div class="field-group">
          <div class="field">
            <label>Yapılandırma Betiği / Sunucu</label>
            <input placeholder="http://proxy.sirket.local/proxy.pac">
          </div>
        </div>
      </div>

      <div class="panel" data-panel="wifi">
        <button class="wifi-scan-btn" data-i18n="wifi.scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
          Ağları Tara
        </button>
        <div class="wifi-list"></div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
